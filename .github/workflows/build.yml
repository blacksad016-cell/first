name: Build APK AI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    # ⚡ 1. Bikin project Flutter standar secara otomatis
    - name: Create Default Flutter Project
      run: flutter create . --project-name=ai_angka --org=com.example

    # 📂 2. Timpa kode bawaan dengan kode AI kita
    - name: Copy Custom Files
      run: |
        cp main.dart lib/main.dart
        cp pubspec.yaml pubspec.yaml
        mkdir -p assets
        cp model_mnist.tflite assets/model_mnist.tflite

    # 🔧 3. JURUS SULAP: Ubah minSdkVersion jadi 26 otomatis
    - name: Fix minSdkVersion
      run: |
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle
        sed -i 's/minSdkVersion 19/minSdkVersion 26/' android/app/build.gradle

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aplikasi-ai-angka
        path: build/app/outputs/flutter-apk/app-release.apk
